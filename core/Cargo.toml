[package]
name = "pixmith-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Document model, pixel tools, file formats and C ABI behind the Pixmith pixel-art editor"
license = "MIT"
repository = "https://github.com/azdharsyahputra/pixmith"
readme = "../README.md"
keywords = ["pixel-art", "sprite", "aseprite", "editor", "gamedev"]
categories = ["graphics", "multimedia::images", "game-development"]

[lib]
name = "pixmith_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
flate2 = "1"
gif = "0.14"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
png = "0.17"
# Image formats beyond PNG and GIF (see src/formats/raster). BMP, TGA, ICO, PCX and FLI/FLC are implemented
# there; JPEG is decoded by zune-jpeg and encoded by jpeg-encoder (4:4:4, so pixel art keeps its colors);
# WebP (lossy, lossless, animated) comes from libwebp through webp-animation, built from its bundled sources.
zune-core = "0.5"
zune-jpeg = "0.5"
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
webp-animation = { version = "0.10", features = ["static"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Keep decompression fast in debug-profile tests (they inflate large zlib bombs).
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
