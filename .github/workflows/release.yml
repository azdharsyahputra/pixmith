name: Release desktop builds

# Builds the egui app (desktop/) for Windows and Linux and attaches the archives to the GitHub release. Windows gets
# the Inno Setup installer plus a portable zip (see windows-installer.yml, which also smoke-tests the installer).
# The macOS disk image is built and uploaded separately with scripts/package.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  windows-upload:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release upload "$TAG" dist/*.zip dist/*.exe --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install Linux packages for eframe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop
            core
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: Build the command line tool
        run: cargo build --release --manifest-path core/Cargo.toml --bin pixmith-cli

      - name: Package
        run: |
          name="Pixmith-${TAG}-linux-x64"
          mkdir -p "dist/$name/bin"
          cp desktop/target/release/pixmith-desktop "dist/$name/Pixmith"
          cp core/target/release/pixmith-cli "dist/$name/bin/pixmith"
          cp desktop/README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
