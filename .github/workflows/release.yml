name: Release desktop builds

# Builds the egui app (desktop/) for Windows and Linux and attaches the archives to the GitHub release. The macOS
# disk image is built and uploaded separately with scripts/package.sh.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (for example v0.2.0)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install Linux packages for eframe
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop
            core
      - name: Build
        working-directory: desktop
        run: cargo build --release
      - name: Build the command line tool
        run: cargo build --release --manifest-path core/Cargo.toml --bin pixmith-cli

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Pixmith-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" -Force | Out-Null
          Copy-Item desktop/target/release/pixmith-desktop.exe "dist/$name/Pixmith.exe"
          Copy-Item core/target/release/pixmith-cli.exe "dist/$name/pixmith-cli.exe"
          Copy-Item desktop/README.md "dist/$name/README.md"
          Copy-Item LICENSE "dist/$name/LICENSE"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="Pixmith-${TAG}-linux-x64"
          mkdir -p "dist/$name"
          cp desktop/target/release/pixmith-desktop "dist/$name/Pixmith"
          cp core/target/release/pixmith-cli "dist/$name/pixmith-cli"
          cp desktop/README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$ASSET" --clobber --repo "$GITHUB_REPOSITORY"
