[package]
name = "pixmith-desktop"
version = "0.4.2"
edition = "2024"
description = "Pixmith, the lightweight pixel-art editor: cross-platform desktop front end built with egui"
license = "MIT"
repository = "https://github.com/azdharsyahputra/pixmith"
readme = "README.md"
build = "build.rs"

[dependencies]
eframe = { version = "0.36", features = ["persistence", "glow"] }
egui-phosphor = "0.14.0"
pixmith-core = { version = "0.1.0", path = "../core" }
arboard = "3.7"
rfd = "0.17.2"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
pollster = "1.0.1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Windows executable properties (Details tab of Explorer's Properties dialog).
[package.metadata.winresource]
ProductName = "Pixmith"
FileDescription = "Pixmith"
OriginalFilename = "Pixmith.exe"
InternalName = "Pixmith"
LegalCopyright = "Copyright (c) Pixmith contributors. MIT License."

[profile.release]
lto = "thin"
strip = true
